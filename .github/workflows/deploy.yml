name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to get the OIDC token for Workload Identity Federation

env:
  REGION: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev/ai-stylist-proto/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          IMAGE=$REGISTRY/${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE ${{ matrix.service }}
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy
        run: gcloud run deploy ${{ matrix.service }} --image $IMAGE --region $REGION --quiet
